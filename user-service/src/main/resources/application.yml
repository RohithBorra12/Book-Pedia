server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/userdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update        # creates/updates tables automatically (fine for learning)
    open-in-view: false
  threads:
    virtual:
      enabled: true           # Java 21 virtual threads for every request

jwt:
  secret: ${JWT_SECRET:bookstore-demo-secret-key-change-me-0123456789}
  expiration-ms: 3600000      # 1 hour

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true         # /actuator/health/liveness and /readiness for Kubernetes
  metrics:
    tags:
      application: ${spring.application.name}

logstash:
  host: ${LOGSTASH_HOST:localhost:5000}
