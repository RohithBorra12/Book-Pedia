# Serves the React build and forwards API calls to each microservice.
# The host names (user-service, book-service, order-service) are the
# docker-compose service names AND the Kubernetes Service names.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;   # React Router support
    }

    location /api/auth/   { proxy_pass http://user-service:8081; }
    location /api/users   { proxy_pass http://user-service:8081; }
    location /api/books   { proxy_pass http://book-service:8082; }
    location /api/orders  { proxy_pass http://order-service:8083; }
}
